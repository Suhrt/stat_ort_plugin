// The Android Gradle Plugin builds the native code with the Android NDK.

group = "com.example.stat_ort_plugin"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath("com.android.tools.build:gradle:8.11.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

def onnxVersion = "1.26.0"

// Directory into which we unpack the prebuilt native libs from the
// onnxruntime-android AAR. Not committed; regenerated on every build.
def onnxNativeDir = layout.buildDirectory.dir("onnxruntime-native").get().asFile

android {
    namespace = "com.example.stat_ort_plugin"

    // Bumping the plugin compileSdk version requires all clients of this plugin
    // to bump the version in their app.
    compileSdk = 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specific NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion = android.ndkVersion

    // Invoke the shared CMake build with the Android Gradle Plugin.
    externalNativeBuild {
        cmake {
            path = "../src/CMakeLists.txt"

            // The default CMake version for the Android Gradle Plugin is 3.10.2.
            // https://developer.android.com/studio/projects/install-ndk#vanilla_cmake
            //
            // The Flutter tooling requires that developers have CMake 3.10 or later
            // installed. You should not increase this version, as doing so will cause
            // the plugin to fail to compile for some customers of the plugin.
            // version "3.10.2"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24

        // Tell CMake where the extracted libonnxruntime.so lives (see the
        // extractOnnxRuntime task below). The native build links against it.
        externalNativeBuild {
            cmake {
                arguments "-DONNXRUNTIME_LIB_DIR=${onnxNativeDir}/jni"
            }
        }
    }
}

// Resolve the AAR separately so we can crack it open and pull out the .so.
configurations {
    onnxruntimeAar
}

dependencies {
    // `implementation` packages libonnxruntime.so into the consuming APK at
    // runtime; `onnxruntimeAar` is just used to extract the .so for linking.
    implementation "com.microsoft.onnxruntime:onnxruntime-android:${onnxVersion}"
    onnxruntimeAar "com.microsoft.onnxruntime:onnxruntime-android:${onnxVersion}"
}

// Extract jni/<abi>/libonnxruntime.so from the AAR so the CMake build has
// something to link against — replaces the prebuilt .so that used to be
// committed to the repo. Runs before the native build via preBuild.
def extractOnnxRuntime = tasks.register("extractOnnxRuntime", Copy) {
    from { configurations.onnxruntimeAar.collect { zipTree(it) } }
    include "jni/**/*.so"
    into onnxNativeDir
}

tasks.named("preBuild").configure {
    dependsOn(extractOnnxRuntime)
}



name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Verify FFI bindings are up to date
        run: |
          dart run ffigen --config ffigen.yaml
          if ! git diff --quiet -- lib/stat_ort_plugin_bindings_generated.dart; then
            echo "::error::Generated bindings are out of date. Run 'dart run ffigen --config ffigen.yaml' and commit the result."
            git --no-pager diff -- lib/stat_ort_plugin_bindings_generated.dart
            exit 1
          fi
      - name: Publish dry-run
        run: dart pub publish --dry-run || true

  build-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check native sources (separate TUs, Android-style)
        run: |
          for f in src/*.c; do
            clang -fsyntax-only -Wall -Iandroid/src/include -Isrc "$f"
          done
      - name: Syntax-check iOS unity build
        run: clang -fsyntax-only -Wall -Iandroid/src/include -Isrc ios/Classes/stat_ort_plugin.c

  build-android:
    # Builds the plugin's native library through Gradle, exercising the
    # onnxruntime AAR extraction + CMake link. No model assets needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - working-directory: example
        run: flutter pub get
      - working-directory: example/android
        run: ./gradlew :stat_ort_plugin:assembleDebug
